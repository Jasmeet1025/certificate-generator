<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificates · ThinkHealth</title>
    <meta name="description" content="Print participation certificates, two A5 certificates per A4 sheet. Runs in this browser; nothing is uploaded." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='8' height='8' fill='%23FFD21F'/%3E%3Crect x='8' width='8' height='8' fill='%230A7A3F'/%3E%3Crect y='8' width='8' height='8' fill='%230A7A3F'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%23FFD21F'/%3E%3C/svg%3E" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar-in">
        <h1 class="mark">ThinkHealth <span>Certificates</span></h1>
        <p class="private" id="private"></p>
      </div>
      <div class="livery" aria-hidden="true"></div>
    </header>

    <main class="work">
      <aside class="rail" aria-label="Batch">
        <section class="block" aria-labelledby="t-template">
          <div class="block-head">
            <h2 id="t-template">Template</h2>
            <label class="link-btn" title="Add a certificate design (PDF exported from Canva)">
              <input type="file" accept="application/pdf,.pdf" id="add-template" class="sr" />
              <span id="add-template-label"></span>
            </label>
          </div>
          <div id="templates" class="templates" role="radiogroup" aria-labelledby="t-template"></div>
        </section>

        <section class="block grow" aria-labelledby="t-people">
          <div class="block-head">
            <h2 id="t-people">Participants</h2>
            <label class="link-btn" title="Open an Excel, CSV or text file">
              <input type="file" accept=".xlsx,.xls,.xlsm,.ods,.csv,.txt,.tsv" id="open-list" class="sr" />
              <span id="open-list-label"></span>
            </label>
          </div>
          <textarea id="list" spellcheck="false" aria-labelledby="t-people" placeholder="One name per line — or paste rows copied from the register (Serial, Certificate No., Name, Location, Course, Date)."></textarea>
          <p class="hint" id="list-hint"></p>
        </section>

        <section class="block" aria-labelledby="t-batch">
          <h2 id="t-batch">Batch</h2>
          <div class="fields">
            <label class="field wide">
              <span>Training location</span>
              <input id="location" autocomplete="off" placeholder="Course conducted at" />
            </label>
            <label class="field">
              <span>Training date</span>
              <input id="date" type="date" />
            </label>
            <label class="field">
              <span>First serial</span>
              <input id="serial" inputmode="numeric" autocomplete="off" placeholder="e.g. 2140" />
            </label>
          </div>
          <p class="hint" id="batch-hint"></p>
        </section>
      </aside>

      <section class="stage" aria-label="Certificates">
        <div class="stage-head">
          <h2>Sheets</h2>
          <p id="counts" class="counts"></p>
        </div>
        <div id="band" class="band" role="listbox" aria-label="Certificates by sheet: top and bottom of each A4 page"></div>

        <div class="split">
          <figure class="preview" id="preview">
            <div class="sheet" id="sheet">
              <canvas id="canvas" role="img" aria-label="Certificate preview"></canvas>
            </div>
            <figcaption id="caption"></figcaption>
          </figure>
          <div class="list-wrap">
            <table class="list" aria-label="Certificates">
              <thead>
                <tr><th scope="col">Sheet</th><th scope="col">Serial</th><th scope="col">Name</th><th scope="col"><span class="sr">Fit and remove</span></th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="actions">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button id="copy" class="btn ghost" type="button"></button>
          <button id="print" class="btn ghost" type="button"></button>
          <button id="download" class="btn primary" type="button"></button>
        </div>
      </section>
    </main>

    <div class="dropping" id="dropping" hidden></div>
    <iframe id="print-frame" title="Print" class="sr" tabindex="-1"></iframe>
  </body>
</html>
